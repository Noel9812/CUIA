name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check OIDC Variables
        run: |
          echo "OIDC URL PRESENT?"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && echo YES || echo NO

          echo "OIDC TOKEN PRESENT?"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" && echo YES || echo NO

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify Identity
        run: aws sts get-caller-identity