name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    environment:
      name: terraform

    steps:
      - name: Check OIDC Variables
        run: |
          echo "OIDC URL PRESENT?"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && echo YES || echo NO

          echo "OIDC TOKEN PRESENT?"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" && echo YES || echo NO

      - name: Decode OIDC Token Claims
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          python3 - <<PY
          import base64
          import json

          payload = """$PAYLOAD"""
          payload += "=" * (-len(payload) % 4)

          decoded = base64.urlsafe_b64decode(payload)
          claims = json.loads(decoded)

          print("\n===== OIDC CLAIMS =====")
          print(json.dumps(claims, indent=2))
          print("=======================\n")

          print("SUB CLAIM:")
          print(claims.get("sub"))
          PY

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify Identity
        run: aws sts get-caller-identity