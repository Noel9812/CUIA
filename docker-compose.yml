services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    networks:
      - cuia_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      APP_ENV: production

    restart: unless-stopped

    networks:
      - cuia_network

  caddy:
    image: caddy:2-alpine

    ports:
      - "80:80"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend
      - backend

    restart: unless-stopped

    networks:
      - cuia_network

networks:
  cuia_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: 